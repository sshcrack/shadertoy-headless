name: release-cli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches Cargo version
        run: python3 scripts/release/version.py --tag "$GITHUB_REF_NAME" --github-repository "$GITHUB_REPOSITORY"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/shadertoy
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/release/shadertoy
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: target/release/shadertoy
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/release/shadertoy.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache and install Linux native dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            autoconf autoconf-archive automake libtool
            clang libclang-dev ninja-build mono-complete
            libgl-dev libglu1-mesa-dev libltdl-dev
            libxcursor-dev libxi-dev libxinerama-dev libxmu-dev xorg-dev
          version: 1.0
          execute_install_scripts: true

      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: ./.github/actions/cache-homebrew-downloads

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja mono

      - name: Configure vcpkg binary cache
        uses: ./.github/actions/configure-vcpkg-cache
        with:
          api-key: ${{ secrets.NUGET_API_KEY }}

      - name: Validate runner target
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "${{ matrix.target }}" || {
            echo "runner host $host does not match release target ${{ matrix.target }}" >&2
            exit 1
          }

      - name: Build static-core CLI
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p shadertoy-cli

      - name: Build static-core CLI for macOS 12+
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: cargo build --release --locked -p shadertoy-cli

      - name: Package cargo-binstall release artifact
        shell: bash
        run: |
          python scripts/release/package_cli.py \
            --target "${{ matrix.target }}" \
            --binary "${{ matrix.binary }}" \
            --tag "$GITHUB_REF_NAME" \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: shadertoy-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shadertoy-cli-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              --title "ShaderToy $GITHUB_REF_NAME"
          fi
