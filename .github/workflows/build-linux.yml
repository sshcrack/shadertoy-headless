name: build-linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Dependencies
      run: sudo apt install libxmu-dev libxi-dev libgl-dev libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev libltdl-dev make ninja-build clang libclang-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Check Rust formatting
      run: cargo fmt --all --check

    - name: Check Rust CLI
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Test Rust workspace
      run: cargo test --workspace

    - name: Configure CMake
      run: cmake -G Ninja -B ${{github.workspace}}/build -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j

    - name: Configure standalone library
      run: cmake -G Ninja -B ${{github.workspace}}/build-lib -DSHADERTOY_BUILD_GUI=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Test standalone library
      run: |
        cmake --build ${{github.workspace}}/build-lib -j
        ctest --test-dir ${{github.workspace}}/build-lib --output-on-failure

    - name: Configure C API
      run: cmake -G Ninja -B ${{github.workspace}}/build-c-api -DSHADERTOY_BUILD_GUI=OFF -DSHADERTOY_BUILD_C_API=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Test C API
      run: |
        cmake --build ${{github.workspace}}/build-c-api -j
        ctest --test-dir ${{github.workspace}}/build-c-api --output-on-failure

    - name: Install
      run: |
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -t install
        rm -f ${{github.workspace}}/install/README.md
        mv ${{github.workspace}}/install ${{github.workspace}}/shadertoy-linux-x86_64
        tar -zcvf ${{github.workspace}}/shadertoy-linux-x86_64.tar.gz --directory ${{github.workspace}} shadertoy-linux-x86_64

    - uses: actions/upload-artifact@v4
      with:
        name: build-linux
        path: ${{github.workspace}}/shadertoy-linux-x86_64.tar.gz
        if-no-files-found: error

