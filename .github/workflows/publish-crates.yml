name: publish-crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v2.0.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact release tag
        shell: bash
        run: |
          git tag --points-at HEAD | grep -Fx -- "${{ inputs.tag }}"
          python3 scripts/release/version.py --tag "${{ inputs.tag }}" --github-repository "$GITHUB_REPOSITORY"

      - name: Cache and install native build dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            clang libclang-dev ninja-build mono-complete
            libgl-dev libglu1-mesa-dev libltdl-dev
            libxcursor-dev libxi-dev libxinerama-dev libxmu-dev xorg-dev
          version: 1.0
          execute_install_scripts: true

      - name: Configure vcpkg binary cache
        uses: ./.github/actions/configure-vcpkg-cache
        with:
          api-key: ${{ secrets.NUGET_API_KEY }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Authenticate to crates.io with OIDC
        id: crates
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: scripts/release/publish_crates.sh
