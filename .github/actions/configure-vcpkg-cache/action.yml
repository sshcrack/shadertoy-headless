name: Configure vcpkg NuGet cache
description: Configure the shared sshcrack NuGet feed as the vcpkg binary cache.

inputs:
  api-key:
    description: NuGet API key used to upload newly built vcpkg packages.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Refresh Mono certificate store (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # vcpkg drives NuGet through Mono on Unix, and Mono ships its own TLS
        # trust store (BoringSSL/btls) that goes stale independently of the
        # system CA bundle. Without a refresh, newer roots (e.g. Google Trust
        # Services WE1) fail with CERTIFICATE_VERIFY_FAILED and every vcpkg
        # package falls back to a from-source build. Same recipe as led-matrix:
        # refresh the system bundle first, then sync it into both Mono stores.
        sudo apt-get update
        sudo apt-get install --reinstall -y ca-certificates
        sudo update-ca-certificates
        if command -v cert-sync >/dev/null 2>&1; then
          sudo cert-sync /etc/ssl/certs/ca-certificates.crt
          cert-sync --user /etc/ssl/certs/ca-certificates.crt
        else
          echo "cert-sync unavailable, skipping Mono certificate refresh"
        fi

    - name: Select vcpkg binary cache mode
      shell: bash
      env:
        NUGET_API_KEY: ${{ inputs.api-key }}
        FEED_URL: https://nuget.sshcrack.me/v3/index.json
      run: |
        mode=read
        if [ -n "$NUGET_API_KEY" ]; then
          mode=readwrite
        fi
        echo "VCPKG_BINARY_SOURCES=clear;nuget,${FEED_URL},${mode}" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/vcpkg-downloads"
        echo "VCPKG_DOWNLOADS=$RUNNER_TEMP/vcpkg-downloads" >> "$GITHUB_ENV"

    - name: Cache vcpkg source and tool downloads
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: ${{ runner.temp }}/vcpkg-downloads
        key: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure NuGet publishing key (Unix)
      if: runner.os != 'Windows' && inputs.api-key != ''
      shell: bash
      env:
        NUGET_API_KEY: ${{ inputs.api-key }}
        FEED_URL: https://nuget.sshcrack.me/v3/index.json
      run: |
        if [ -n "${VCPKG_ROOT:-}" ]; then
          vcpkg_exe="$VCPKG_ROOT/vcpkg"
        elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
          vcpkg_exe="$VCPKG_INSTALLATION_ROOT/vcpkg"
        else
          # command -v fails when vcpkg is not on PATH; must not die silently
          # under `bash -e`, so fall back explicitly (notably the
          # ubuntu-24.04-arm partner image sets neither VCPKG_ROOT nor
          # VCPKG_INSTALLATION_ROOT).
          vcpkg_exe="$(command -v vcpkg || true)"
        fi
        if [ -z "$vcpkg_exe" ] && [ -x /usr/local/share/vcpkg/vcpkg ]; then
          vcpkg_exe=/usr/local/share/vcpkg/vcpkg
        fi
        if [ ! -x "$vcpkg_exe" ]; then
          echo "::error::vcpkg executable not found (checked VCPKG_ROOT, VCPKG_INSTALLATION_ROOT, PATH and /usr/local/share/vcpkg/vcpkg)"
          exit 1
        fi
        echo "Using vcpkg at $vcpkg_exe"
        nuget_exe="$("$vcpkg_exe" fetch nuget | tail -n 1)"
        if [ ! -f "$nuget_exe" ]; then
          echo "::error::could not locate nuget via '$vcpkg_exe fetch nuget' (got: '$nuget_exe')"
          exit 1
        fi
        case "$nuget_exe" in
          *.exe|*.EXE)
            mono "$nuget_exe" setapikey "$NUGET_API_KEY" -Source "$FEED_URL"
            ;;
          *)
            "$nuget_exe" setapikey "$NUGET_API_KEY" -Source "$FEED_URL"
            ;;
        esac

    - name: Configure NuGet publishing key (Windows)
      if: runner.os == 'Windows' && inputs.api-key != ''
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ inputs.api-key }}
        FEED_URL: https://nuget.sshcrack.me/v3/index.json
      run: |
        if ($env:VCPKG_ROOT) {
          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
        } elseif ($env:VCPKG_INSTALLATION_ROOT) {
          $vcpkgExe = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
        } else {
          $vcpkgExe = (Get-Command vcpkg.exe).Source
        }
        $nugetExe = (& $vcpkgExe fetch nuget | Select-Object -Last 1)
        & $nugetExe setapikey $env:NUGET_API_KEY -Source $env:FEED_URL
