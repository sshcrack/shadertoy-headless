[package]
name = "shadertoy-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Safe Rust wrapper for the ShaderToy renderer runtime and project API"
readme = "README.md"
keywords = ["shadertoy", "shader", "opengl", "graphics", "rendering"]
categories = ["graphics", "rendering"]

[dependencies]
shadertoy-sys = { version = "2.0.1", path = "../.." }
thiserror = "2.0"

[lib]
name = "shadertoy"
