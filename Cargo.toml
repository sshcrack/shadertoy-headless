[package]
name = "shadertoy-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Yingwei Zheng <dtcxzyw@qq.com>", "Hendrik Lind <hendrik@sshcrack.me>"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/shadertoy-sys"
description = "Raw generated Rust bindings for the ShaderToy renderer and stable C ABI"
readme = "README.md"
keywords = ["shadertoy", "shader", "opengl", "ffi", "graphics"]
categories = ["external-ffi-bindings", "graphics"]
links = "shadertoy"
build = "crates/shadertoy-sys/build.rs"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CMakeLists.txt",
    "/vcpkg.json",
    "crates/shadertoy-sys/build.rs",
    "crates/shadertoy-sys/src/**",
    "shadertoy/**",
    "shadertoy-c/**",
]

[lib]
path = "crates/shadertoy-sys/src/lib.rs"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"

[workspace]
members = [
    "crates/shadertoy",
    "crates/shadertoy-cli",
]
resolver = "3"

[workspace.package]
version = "2.2.8"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Hendrik Lind <hendrik@sshcrack.me>"]
repository = "https://github.com/sshcrack/shadertoy"
homepage = "https://github.com/sshcrack/shadertoy"
